[behave]
format = html-pretty
outfiles = reports/reporte.html

[behave.formatters]
html-pretty = behave_html_pretty_formatter:PrettyHTMLFormatter

[behave.userdata]
behave.formatter.html-pretty.title_string = Reporte de pruebas automatizadas
behave.formatter.html-pretty.show_summary = true
behave.formatter.html-pretty.global_summary = true